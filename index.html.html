<div class="app"><aside><div class="logo">Echo<b>Class</b></div><div id="nav" style="display:contents"></div></aside><main><div class="top" id="top"></div><div id="main"></div></main></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BL=['Вовлечённость','Мотивация','Образовательная среда','Перспективы'],BC=['#6d4aff','#12b886','#ff922b','#f03e8c'],K=5;

const T=['Я регулярно посещаю занятия и готовлюсь к ним','Мне интересно работать на занятиях','Я активно задаю вопросы и участвую в обсуждениях','Мне понятно, что и зачем мы изучаем','Я учусь, потому что мне интересен предмет','Я готов прилагать усилия, даже если задание сложное','Я верю, что смогу освоить материал','Преподаватель поддерживает мой интерес к учёбе','Я понимаю, как знания пригодятся в профессии','Я вижу свои карьерные перспективы после обучения','Я планирую развиваться в этой области','Программа соответствует моим ожиданиям','Мне комфортно выражать своё мнение на занятиях','Преподаватель объясняет материал понятно','Преподаватель открыт к вопросам и обратной связи','Нагрузка и сроки заданий посильны'];
const QB=[0,0,0,0,1,1,1,1,3,3,3,3,2,2,2,2],QS=T.map((t,i)=>({t,b:QB[i]}));
const REC=[['Вовлечённость: добавьте короткие интерактивы (опросы, мини-кейсы, работу в парах) и в начале темы объясняйте, зачем она нужна.'],['Мотивация: дробите крупные задания на этапы с быстрой обратной связью, давайте выбор тем и формата работ, отмечайте прогресс.'],['Среда: регулярно собирайте анонимную обратную связь, договоритесь о правилах уважительной дискуссии, сверьте нагрузку и сроки между дисциплинами.'],['Перспективы: приглашайте практиков, показывайте реальные профессиональные задачи, обсуждайте индивидуальные траектории развития.']];
function rng(s){return()=>(s=(s*1664525+1013904223)%4294967296)/4294967296}
function demo(){const r=rng(7),o=[];let n=1;[['ИС-21',.3,.1,.2,0,14],['ИС-22',-.2,-.4,-.5,-.3,14],['ПИ-21',0,.2,.1,.3,14],['ЭК-22',.1,0,0,.1,4]].forEach(g=>{for(let i=0;i<g[5];i++){const b=(r()+r()+r())/3*3.2+1,off=[g[1],g[2],g[4],g[3]],a=[];for(let c=0;c<4;c++)for(let k=0;k<4;k++)a.push(Math.max(1,Math.min(5,Math.round(b+off[c]+(r()-.5)*1.6))));o.push({id:'С-'+n++,g:g[0],a})}});return o}
const mini=[{t:'Темп занятий мне подходит',b:0},{t:'Мне понятны критерии оценивания',b:2},{t:'Мне интересны практические задания',b:0},{t:'Я уверен в своих успехах по курсу',b:1}];
function fake(k){const r=rng(3),o=[];for(let i=0;i<k;i++)o.push({id:'x'+i,g:['ИС-21','ИС-22','ПИ-21'][i%3],a:mini.map(()=>2+Math.round(r()*3))});return o}
let SV=[{id:'s1',title:'Образовательный опыт студентов',anon:false,pub:true,qs:QS,r:demo()},{id:'s2',title:'Мини-опрос по курсу (анонимный)',anon:true,pub:true,qs:mini,r:fake(6)}];
let cur=0,role='t',page='dash',grp='all',PS=true,HID={},EXTRA=[],DR={title:'',anon:true,qs:[{t:'',b:0}]},TK=null,SC={a:1,b:0},msg='';
const STU={id:'С-3',g:'ИС-21'},DONE={s1:[{d:'02.11.2026'}]},FB=[{t:'Слишком много дедлайнов в конце месяца, нагрузка неравномерная',c:'Нагрузка',d:'10.11.2026'},{t:'Хотелось бы больше практических примеров и кейсов',c:'Практика',d:'12.11.2026'},{t:'Не всегда понятно, как выставляются оценки',c:'Оценивание',d:'14.11.2026'}];
const S=()=>SV[cur],D=()=>S().r.filter(x=>grp=='all'||x.g==grp),gs=()=>[...new Set(S().r.map(x=>x.g))],pid=id=>PS||S().anon?'№'+hs(id):E(id);
const bi=(s,b,q=S().qs)=>avg(s.a.filter((_,i)=>q[i].b==b)),bm=(d,b)=>avg(d.map(s=>bi(s,b))),ov=s=>avg([0,1,2,3].map(b=>bi(s,b))),risk=s=>{const m=[0,1,2,3].map(b=>bi(s,b)).filter(x=>x!=null);return ov(s)<2.75||Math.min(...m)<2.25};
function pear(p){const n=p.length,mx=avg(p.map(x=>x[0])),my=avg(p.map(x=>x[1]));let a=0,b=0,c=0;p.forEach(x=>{a+=(x[0]-mx)*(x[1]-my);b+=(x[0]-mx)**2;c+=(x[1]-my)**2});return b&&c?a/Math.sqrt(b*c):0}
const rf=r=>r.toFixed(2).replace('.',',');
function an(d){const q=S().qs,m=[0,1,2,3].map(b=>bm(d,b)),ins=[],rec=[],prob=[],cor=[],neg=[],blk=[],tot=avg(d.map(ov));
q.forEach((x,i)=>{const v=d.map(s=>s.a[i]).filter(a=>a!=null),lo=v.filter(a=>a<=2).length/(v.length||1);if(v.length&&lo>=.25)prob.push({i,lo,m:avg(v)})});prob.sort((a,b)=>b.lo-a.lo);
m.forEach((v,b)=>{if(v==null)return;blk[b]=`Уровень по блоку «${BL[b]}» — ${['низкий','средний','высокий'][lvl(v)]} (${f1(v)} из 5).`;if(v<3.5)rec.push(REC[b][0]);if(v<3.2)neg.push(`Блок «${BL[b]}» ниже ориентира 3,5 (${f1(v)}).`)});
for(let a=0;a<4;a++)for(let b=a+1;b<4;b++){const p=d.map(s=>[bi(s,a),bi(s,b)]).filter(x=>x[0]!=null&&x[1]!=null);if(p.length>=8)cor.push({a,b,r:pear(p),n:p.length})}cor.sort((x,y)=>Math.abs(y.r)-Math.abs(x.r));
cor.forEach(c=>{const z=Math.abs(c.r);c.t=`«${BL[c.a]}» и «${BL[c.b]}»: ${z>=.6?'выраженная':z>=.4?'умеренная':z>=.2?'слабая':'не выявлена'}${z>=.2?(c.r<0?' отрицательная':' положительная')+' связь':' связь'} (r = ${rf(c.r)}, n = ${c.n}).`});
gs().forEach(g=>{const dg=S().r.filter(x=>x.g==g);if(dg.length<K)return;const v=avg(dg.map(ov));if(v<tot-.35)neg.push(`Группа ${E(g)} заметно ниже среднего по выборке (${f1(v)} против ${f1(tot)}).`)});
const sd=Math.sqrt(avg(d.map(s=>(ov(s)-tot)**2)));if(sd>.9)neg.push('Большой разброс ответов: в выборке есть полярные подгруппы, средние значения могут скрывать проблемы.');
prob.slice(0,3).forEach(p=>neg.push(`Утверждение «${E(q[p.i].t)}»: ${Math.round(p.lo*100)}% студентов оценили на 1–2.`));
const ok=m.map((v,b)=>({v,b})).filter(x=>x.v!=null).sort((a,b)=>a.v-b.v),rs=d.filter(risk).length;
if(ok.length>1){ins.push(`Самый сильный блок — «${BL[ok[ok.length-1].b]}» (${f1(ok[ok.length-1].v)}), наиболее уязвимый — «${BL[ok[0].b]}» (${f1(ok[0].v)}).`)}
if(cor[0])ins.push('Наиболее заметная связь показателей — '+cor[0].t.replace(/^«/,'«'));
if(prob[0])ins.push(`Самая распространённая проблема: «${E(q[prob[0].i].t)}» (${Math.round(prob[0].lo*100)}% низких оценок).`);
ins.push(`В зоне внимания ${rs} из ${d.length} студентов (${Math.round(rs/d.length*100)}%).`);
const lv=b=>m[b]==null?'':['низкая','средняя','высокая'][lvl(m[b])],P=[];
if(m[0]!=null)P.push(`Вовлечённость ${lv(0)}, мотивация ${lv(1)}.`);if(m[2]!=null)P.push(`Оценка образовательной среды — ${lv(2)}.`);P.push(`Ожидания от дальнейшего обучения и карьерные перспективы оцениваются как ${lv(3)}.`);
P.push(sd>.9?'Группа неоднородна: рядом существуют и увлечённые, и отстранённые студенты.':'Ответы в группе в целом согласованы.');P.push(`Студентов в зоне внимания: ${Math.round(rs/d.length*100)}%.`);
return{ins,rec:[...new Set(rec)],prob,cor,neg,blk,m,tot,portrait:P.join(' ')+' Портрет описывает агрегированные ответы анкеты и не является психологической диагностикой.'}}
function radar(ser){const cx=150,cy=125,R=90,pt=(i,v)=>{const a=i*Math.PI/2-Math.PI/2;return[cx+v/5*R*Math.cos(a),cy+v/5*R*Math.sin(a)]},ps=(f)=>[0,1,2,3].map(i=>pt(i,f(i)).map(x=>x.toFixed(1)).join(',')).join(' ');
let s='<svg viewBox="0 0 300 250" width="100%" style="max-width:400px;display:block;margin:auto">';[1,2,3,4,5].forEach(k=>s+=`<polygon points="${ps(()=>k)}" fill="none" stroke="var(--bd)"/>`);
['Вовлеч.','Мотив.','Среда','Перспект.'].forEach((l,i)=>{const p=pt(i,5.9);s+=`<text x="${p[0]}" y="${p[1]+4}" font-size="11" text-anchor="middle" fill="var(--mut)">${l}</text>`});
ser.forEach(x=>{s+=`<polygon points="${ps(i=>x.v[i]||0)}" fill="${x.c}" fill-opacity=".1" stroke="${x.c}" stroke-width="2"/>`+x.v.map((v,i)=>{const p=pt(i,v||0);return`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="${x.c}"><title>${E(x.n)} · ${BL[i]}: ${f1(v)}</title></circle>`}).join('')});return s+'</svg>'}
const kpi=(a,b,c)=>`<div class="card"><div class="mut">${a}</div><div class="big" ${c?`style="color:${c}"`:''}>${b}</div></div>`,sec=(a,b)=>`<div class="card"><h3>${a}</h3>${b}</div>`;
const list=a=>a.length?'<ul>'+a.map(x=>`<li>${x}</li>`).join('')+'</ul>':'<div class="mut">Существенных замечаний не выявлено.</div>';
const bar=(l,v,sub)=>`<div class="q"><div>${l}${sub?`<div class="mut">${sub}</div>`:''}</div><div>${pill(v)}</div><div class="bar"><i style="width:${(v||0)/5*100}%;background:${col(v)}"></i></div></div>`;
const dist=(d,b)=>{const c=[0,0,0];d.forEach(s=>{const v=bi(s,b);if(v!=null)c[lvl(v)]++});const t=c[0]+c[1]+c[2]||1;return`<div class="mut">${BL[b]}: низкий ${c[0]} · средний ${c[1]} · высокий ${c[2]}</div><div class="stack">${['lo','mid','hi'].map((k,i)=>`<i style="width:${c[i]/t*100}%;background:var(--${k})" title="${c[i]}"></i>`).join('')}</div>`};
const guard=f=>()=>{const d=D();if(!d.length)return sec('Нет данных','Загрузите CSV/Excel или заполните анкету. См. раздел «Анкеты».');if(d.length<K)return`<div class="note warn"><b>Защита персональных данных.</b> Выборка из ${d.length} ответов меньше порога ${K}: статистика скрыта, чтобы нельзя было вычислить ответы отдельного человека.</div>`;return f(d)};
const PG={};
PG.dash=guard(d=>{const a=an(d),G=gs().filter(g=>S().r.filter(x=>x.g==g).length>=K),ser=[{n:'Все',c:'#667189',v:[0,1,2,3].map(b=>bm(d,b))}].concat(G.map((g,i)=>({n:g,c:BC[i%4],v:[0,1,2,3].map(b=>bm(S().r.filter(x=>x.g==g),b))}))).filter(x=>!HID[x.n]);
const rs=d.filter(risk).length;
return`<div class="grid">${kpi('Анкет в выборке',d.length)}${kpi('Учебных групп',gs().length)}${kpi('Общий индекс',f1(a.tot),col(a.tot))}${kpi('Зона внимания',Math.round(rs/d.length*100)+'%')}</div>
<div class="g2"><div class="card"><h3>Профиль групп</h3><div>${['Все'].concat(G).map((g,i)=>`<span class="chip ${HID[g]?'off':''}" onclick="HID['${g}']=!HID['${g}'];render()" style="border-color:${i?BC[(i-1)%4]:'#667189'}">${E(g)}</span>`).join('')}</div>${radar(ser)}</div>
${sec('Ключевые выводы',list(a.ins))}</div>${sec('Уровни по блокам',[0,1,2,3].map(b=>dist(d,b)).join(''))}
${sec('Статус прототипа и архитектура',`<div class="mut"><b>Работает в браузере:</b> импорт CSV/XLSX, расчёты, графики, конструктор анкет, прохождение анкет, роли (разделение интерфейсов), правило минимальной группы (${K}), псевдонимизация, аналитический движок на правилах и статистике.<br><b>Требует сервера:</b> настоящая авторизация и права доступа, база данных (PostgreSQL), рассылка ссылок студентам, хранение ответов между сессиями, экспорт файлов, интеграция с LLM API (сервер получает только агрегаты и формирует текстовое заключение).</div>`)}`});
const bp=b=>d=>{const q=S().qs,ix=q.map((x,i)=>i).filter(i=>q[i].b==b);if(!ix.length)return sec(BL[b],'В выбранной анкете нет вопросов этого блока.');const a=an(d),m=a.m[b],v=d.map(s=>bi(s,b)),bins=[0,0,0,0,0];v.forEach(x=>{if(x!=null)bins[Math.min(4,Math.floor(x-1))]++});const mx=Math.max(...bins,1);
return`<div class="grid">${kpi('Средний балл',f1(m)+' / 5',col(m))}${kpi('Высокий уровень',Math.round(v.filter(x=>x>=3.75).length/d.length*100)+'%')}${kpi('Низкий уровень',Math.round(v.filter(x=>x!=null&&x<2.5).length/d.length*100)+'%')}</div>
<div class="note">${a.blk[b]} ${m<3.5?REC[b][0]:'Показатель в хорошей зоне — поддерживайте текущие практики.'}</div>
<div class="g2">${sec('Ответы по вопросам',ix.map(i=>bar(E(q[i].t),avg(d.map(s=>s.a[i])),`согласны (4–5): ${Math.round(d.filter(s=>s.a[i]>=4).length/d.length*100)}%`)).join(''))}
<div>${sec('Сравнение групп',gs().map(g=>{const dg=S().r.filter(x=>x.g==g);return dg.length<K?`<div class="mut">${E(g)}: скрыто (меньше ${K} ответов)</div>`:bar(E(g),bm(dg,b),dg.length+' чел.')}).join(''))}
${sec('Распределение студентов',`<svg viewBox="0 0 250 90" width="100%">${bins.map((n,i)=>`<rect x="${i*50+8}" y="${70-n/mx*60}" width="34" height="${n/mx*60}" rx="4" fill="${BC[b]}"><title>${i+1}–${i+2}: ${n} чел.</title></rect><text x="${i*50+25}" y="85" font-size="10" text-anchor="middle" fill="var(--mut)">${i+1}–${i<4?i+2:5}</text>`).join('')}</svg>`)}</div></div>`};
PG.en=guard(bp(0));PG.mo=guard(bp(1));
PG.ev=guard(d=>{const th={'Нагрузка':/нагруз|задани|дедлайн|срок/i,'Подача материала':/объясн|понят|темп|скучн/i,'Практика':/практик|пример|кейс/i,'Общение':/общен|вопрос|обратн/i,'Оценивание':/оцен|экзамен|балл|зач[её]т/i},c=Object.keys(th).map(k=>[k,FB.filter(f=>th[k].test(f.t)).length]).filter(x=>x[1]);
return bp(2)(d)+sec('Анонимные отзывы студентов ('+FB.length+')',`<div class="mut">Темы по ключевым словам: ${c.map(x=>x[0]+' — '+x[1]).join(' · ')||'—'}</div>`+list(FB.map(f=>`${E(f.t)} <span class="mut">(${E(f.c)}, ${f.d})</span>`)))});
PG.ai=guard(d=>{const a=an(d),q=S().qs,o=[0,1,2,3].map(b=>`<option value="${b}">${BL[b]}</option>`).join(''),p=d.map(s=>[bi(s,SC.a),bi(s,SC.b),s.id]).filter(x=>x[0]!=null&&x[1]!=null),r=p.length>7?pear(p):0;
return`<div class="note"><b>Как работает анализ.</b> Это встроенный аналитический движок (статистика и правила), а не внешний ИИ. Корреляции показывают ассоциации и не доказывают причинно-следственных связей. Система не ставит диагнозов и анализирует только образовательные показатели.</div>
${sec('Педагогический портрет группы',`<p style="margin:0">${a.portrait}</p>`)}<div class="g2">${sec('Закономерности и взаимосвязи',list(a.cor.map(c=>c.t)))}${sec('Негативные тенденции',list(a.neg))}</div>
<div style="height:14px"></div><div class="g2">${sec('Практические рекомендации',list(a.rec.length?a.rec:['Критичных зон нет: сохраняйте практики и повторите опрос в конце семестра.']))}${sec('Выводы',list(a.ins))}</div>
<div style="height:14px"></div>${sec('Диаграмма рассеяния',`<div class="row">X: <select onchange="SC.a=+this.value;render()">${o.replace(`value="${SC.a}"`,`value="${SC.a}" selected`)}</select> Y: <select onchange="SC.b=+this.value;render()">${o.replace(`value="${SC.b}"`,`value="${SC.b}" selected`)}</select> <span class="mut">r = ${rf(r)}, n = ${p.length}</span></div><svg viewBox="0 0 320 230" width="100%" style="max-width:520px"><rect x="30" y="10" width="280" height="190" fill="none" stroke="var(--bd)"/>${[1,2,3,4,5].map(k=>`<text x="${30+(k-1)*70}" y="218" font-size="10" fill="var(--mut)" text-anchor="middle">${k}</text><text x="22" y="${200-(k-1)*47.5+3}" font-size="10" fill="var(--mut)" text-anchor="end">${k}</text>`).join('')}${p.map((x,i)=>`<circle cx="${30+(x[0]-1)*70+((i*7)%9-4)}" cy="${200-(x[1]-1)*47.5+((i*5)%9-4)}" r="5" fill="${BC[SC.b]}" fill-opacity=".55"><title>${pid(x[2])}: ${f1(x[0])}; ${f1(x[1])}</title></circle>`).join('')}</svg>`)}`});
PG.rp=guard(d=>`<div class="card"><h3>Аналитический отчёт</h3><div class="row noprint"><button class="btn" onclick="cp()">Копировать текст</button><button class="btn s" onclick="window.print()">Печать</button><span class="mut">Область: ${grp=='all'?'все группы':E(grp)}. Скачивание файлов требует серверной части.</span></div><textarea id="rp" rows="26" readonly>${E(rep(d))}</textarea></div>`);
function rep(d){const a=an(d),q=S().qs;return[`ОТЧЁТ EchoClass — ${S().title}`,`Дата: ${new Date().toLocaleDateString('ru-RU')} · Область: ${grp=='all'?'все группы':grp} · Анкет: ${d.length}`,'','ПОКАЗАТЕЛИ (шкала 1–5)',...[0,1,2,3].map(b=>`• ${BL[b]}: ${f1(a.m[b])}`),'','ГРУППЫ',...gs().map(g=>{const x=S().r.filter(y=>y.g==g);return x.length<K?`• ${g}: данные скрыты (меньше ${K} ответов)`:`• ${g} (${x.length}): `+[0,1,2,3].map(b=>f1(bm(x,b))).join(' / ')}),'','ПОРТРЕТ ГРУППЫ',a.portrait,'','ЗАКОНОМЕРНОСТИ',...a.cor.map(c=>'• '+c.t),'(связи ≠ причинность)','','ПРОБЛЕМЫ И ТЕНДЕНЦИИ',...(a.neg.length?a.neg.map(x=>'• '+x.replace(/&quot;/g,'"')):['• не выявлено']),'','РЕКОМЕНДАЦИИ',...(a.rec.length?a.rec.map(x=>'• '+x):['• сохранять текущие практики']),'','Отчёт основан на агрегированных данных, не содержит диагнозов.'].join('\n')}
function cp(){const t=$('#rp');t.select();document.execCommand('copy')}
PG.gr=()=>{const G=[...new Set([...gs(),...EXTRA])];return sec('Учебные группы',`<div class="sc"><table><tr><th>Группа</th><th>Чел.</th>${BL.map(b=>`<th>${b}</th>`).join('')}<th>Переименовать</th></tr>${G.map((g,i)=>{const x=S().r.filter(y=>y.g==g),h=x.length>=K;return`<tr><td><b>${E(g)}</b></td><td>${x.length}</td>${[0,1,2,3].map(b=>`<td>${h?pill(bm(x,b)):'<span class="mut">скрыто</span>'}</td>`).join('')}<td><input type="text" id="rn${i}" value="${E(g)}" style="width:100px"> <button class="btn s sm" onclick="ren(${i})">OK</button></td></tr>`}).join('')}</table></div>
<div class="row" style="margin-top:12px"><input type="text" id="ng" placeholder="Новая группа"><button class="btn sm" onclick="addG()">Добавить</button></div><div class="mut">Группы меньше ${K} человек не показываются в статистике (защита от деанонимизации). Состав (${PS?'псевдонимы':'идентификаторы'}): ${G.map(g=>E(g)+': '+S().r.filter(y=>y.g==g).map(y=>pid(y.id)).slice(0,6).join(', ')+'…').join(' | ')}</div>`)};
PG.sv=()=>`${msg?`<div class="note">${msg}</div>`:''}${sec('Анкеты',`<div class="sc"><table><tr><th>Название</th><th>Вопросов</th><th>Ответов</th><th>Режим</th><th></th></tr>${SV.map((s,i)=>`<tr><td>${i==cur?'<b>'+E(s.title)+'</b>':E(s.title)}</td><td>${s.qs.length}</td><td>${s.r.length}</td><td>${s.anon?'анонимная':'именная'} · ${s.pub?'опубликована':'черновик'}</td><td><button class="btn s sm" onclick="cur=${i};grp='all';render()">Открыть</button> <button class="btn s sm" onclick="SV[${i}].pub=!SV[${i}].pub;render()">${s.pub?'Снять':'Опубликовать'}</button></td></tr>`).join('')}</table></div><div class="mut">Публикация открывает анкету в кабинете студента (переключите роль сверху). Рассылка ссылок по e-mail требует сервера.</div>`)}
${sec('Загрузка результатов в «'+E(S().title)+'»',`<div class="row"><input type="file" accept=".csv,.txt,.xlsx,.xls" onchange="imp(this.files[0])"><span class="mut">CSV (; или ,) и Excel. Столбцы: id, группа, затем ${S().qs.length} ответов 1–5${S().qs.length==16?' (допустим формат из 12 ответов без блока «Среда»)':''}. Данные заменяют текущие.</span></div><button class="btn s sm" onclick="SV[cur].r=demo();msg='Демо-данные восстановлены';render()">Демо-данные</button>`)}
${sec('Конструктор анкеты',`<div class="row"><input type="text" placeholder="Название анкеты" value="${E(DR.title)}" oninput="DR.title=this.value" style="flex:1"><label><input type="checkbox" ${DR.anon?'checked':''} onchange="DR.anon=this.checked"> анонимная</label></div>${DR.qs.map((x,i)=>`<div class="row"><input type="text" style="flex:1;min-width:200px" placeholder="Утверждение ${i+1}" value="${E(x.t)}" oninput="DR.qs[${i}].t=this.value"><select onchange="DR.qs[${i}].b=+this.value">${BL.map((b,j)=>`<option value="${j}" ${x.b==j?'selected':''}>${b}</option>`).join('')}</select><button class="btn s sm" onclick="DR.qs.splice(${i},1);render()">✕</button></div>`).join('')}<div class="row"><button class="btn s sm" onclick="DR.qs.push({t:'',b:0});render()">+ вопрос</button><button class="btn sm" onclick="saveSv()">Сохранить анкету</button></div><div class="mut">Шкала ответа: 1–5 (Ликерт).</div>`)}`;
PG.sh=()=>{const o=SV[0].r.filter(x=>x.id==STU.id).pop(),q=SV[0].qs,v=[0,1,2,3].map(b=>bi(o,b,q)),G=SV[0].r.filter(x=>x.g==STU.g),gv=G.length>=K?[0,1,2,3].map(b=>bm(G,b)):null;
return`<div class="card"><h3>Здравствуйте, ${pid(STU.id)}</h3><div class="mut">Группа ${E(STU.g)} · Доступных анкет: ${SV.filter(s=>s.pub&&!(DONE[s.id]||[]).length).length}</div></div><div class="grid">${v.map((x,b)=>kpi(BL[b],f1(x),col(x))).join('')}</div><div class="g2">${sec('Мой профиль'+(gv?' и среднее по группе':''),radar([{n:'Я',c:'#6d4aff',v}].concat(gv?[{n:'Группа',c:'#adb5bd',v:gv}]:[])))}${sec('Как читать результаты',`<div class="mut">Показатели — это самооценка по анкете, а не диагноз или оценка способностей. Значение ниже 2,5 — повод обсудить трудности с преподавателем или куратором; выше 3,75 — сильная сторона.</div>`+list(v.map((x,b)=>x==null?'':`${BL[b]}: ${['низкий','средний','высокий'][lvl(x)]} уровень`).filter(Boolean)))}</div>`};
PG.sa=()=>{if(TK){const s=SV[TK.i];return sec(E(s.title),`<div class="mut">${s.anon?'Анонимная: ваши ответы не связываются с вами.':'Именная: ответы видны преподавателю в псевдонимизированном виде.'} Шкала: 1 — совсем не согласен, 5 — полностью согласен.</div>${s.qs.map((x,j)=>`<div style="margin:12px 0"><div>${j+1}. ${E(x.t)}</div>${[1,2,3,4,5].map(v=>`<label style="margin-right:12px"><input type="radio" name="q${j}" onchange="TK.a[${j}]=${v}"> ${v}</label>`).join('')}</div>`).join('')}<button class="btn" onclick="subTk()">Отправить</button> <button class="btn s" onclick="TK=null;render()">Отмена</button>`)}
const av=SV.map((s,i)=>[s,i]).filter(x=>x[0].pub&&!(DONE[x[0].id]||[]).length);return`${msg?`<div class="note">${msg}</div>`:''}`+sec('Доступные анкеты',av.length?av.map(x=>`<div class="row"><b style="flex:1">${E(x[0].title)}</b><span class="mut">${x[0].qs.length} вопросов</span><button class="btn sm" onclick="TK={i:${x[1]},a:[]};msg='';render()">Пройти</button></div>`).join(''):'<div class="mut">Новых анкет нет.</div>')};
PG.hi=()=>sec('История заполнения',SV.filter(s=>(DONE[s.id]||[]).length).map(s=>{const o=!s.anon&&s.r.filter(x=>x.id==STU.id).pop();return`<div class="row"><b style="flex:1">${E(s.title)}</b><span class="mut">${DONE[s.id].map(x=>x.d).join(', ')}${s.anon?' · анонимно':''}</span>${o?[0,1,2,3].map(b=>bi(o,b,s.qs)).map((x,b)=>x==null?'':`<span title="${BL[b]}">${pill(x)}</span>`).join(''):''}</div>`}).join('')||'Пока пусто.');
PG.fb=()=>`${msg?`<div class="note">${msg}</div>`:''}`+sec('Анонимный отзыв или предложение',`<div class="mut" style="margin-bottom:8px">Ваше имя и группа не сохраняются вместе с отзывом.</div><div class="row"><select id="fc">${['Нагрузка','Подача материала','Практика','Общение','Оценивание','Другое'].map(x=>`<option>${x}</option>`).join('')}</select></div><textarea id="ft" rows="4" placeholder="Что стоит улучшить?"></textarea><p><button class="btn" onclick="subFb()">Отправить анонимно</button></p>`);
const NAV={t:[['dash','Панель'],['sv','Анкеты'],['en','Вовлечённость'],['mo','Мотивация'],['ev','Образовательная среда'],['ai','ИИ-аналитика'],['rp','Отчёты'],['gr','Группы']],s:[['sh','Главная'],['sa','Анкеты'],['hi','История'],['fb','Отзывы']]};
function render(){$('#nav').innerHTML=NAV[role].map(n=>`<button class="nv ${page==n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('');
const nm=(NAV[role].find(n=>n[0]==page)||[0,''])[1];
$('#top').innerHTML=`<h1>${nm}</h1>`+(role=='t'?`<select onchange="cur=+this.value;grp='all';render()">${SV.map((s,i)=>`<option value="${i}" ${i==cur?'selected':''}>${E(s.title)}</option>`).join('')}</select><select onchange="grp=this.value;render()"><option value="all">Все группы</option>${gs().map(g=>`<option ${g==grp?'selected':''}>${E(g)}</option>`).join('')}</select><label class="mut"><input type="checkbox" ${PS?'checked':''} onchange="PS=this.checked;render()"> псевдонимы</label>`:'')+`<select onchange="role=this.value;page=role=='t'?'dash':'sh';msg='';TK=null;render()"><option value="t" ${role=='t'?'selected':''}>Преподаватель</option><option value="s" ${role=='s'?'selected':''}>Студент (${pid(STU.id)})</option></select>`;
$('#main').innerHTML=PG[page]()}
function go(p){page=p;TK=null;msg='';render()}
function addG(){const v=$('#ng').value.trim();if(v&&!EXTRA.includes(v))EXTRA.push(v);render()}
function ren(i){const G=[...new Set([...gs(),...EXTRA])],n=$('#rn'+i).value.trim();if(!n)return;S().r.forEach(x=>{if(x.g==G[i])x.g=n});EXTRA=EXTRA.map(x=>x==G[i]?n:x);render()}
function saveSv(){const q=DR.qs.filter(x=>x.t.trim());if(!DR.title.trim()||!q.length){msg='Укажите название и хотя бы один вопрос.';return render()}SV.push({id:'s'+Date.now(),title:DR.title.trim(),anon:DR.anon,pub:false,qs:q.map(x=>({t:x.t.trim(),b:x.b})),r:[]});cur=SV.length-1;DR={title:'',anon:true,qs:[{t:'',b:0}]};msg='Анкета сохранена как черновик. Опубликуйте её, чтобы студенты могли пройти опрос.';render()}
function parse(txt){const L=txt.split(/\r?\n/).filter(l=>l.trim());if(L.length<2)return[[],0];const sep=(L[0].match(/;/g)||[]).length>=(L[0].match(/,/g)||[]).length?';':',',n=S().qs.length,res=[];let bad=0;
L.slice(1).forEach((l,i)=>{const c=l.split(sep).map(x=>x.trim()),num=c.slice(2).map(x=>parseFloat(x.replace(',','.'))),ok=a=>a.length&&a.every(x=>x>=1&&x<=5);let a=null;if(num.length>=n&&ok(num.slice(0,n)))a=num.slice(0,n);else if(n==16&&num.length>=12&&ok(num.slice(0,12)))a=num.slice(0,12).concat([null,null,null,null]);a?res.push({id:c[0]||'С-'+(i+1),g:c[1]||'—',a}):bad++});return[res,bad]}
function imp(f){if(!f)return;const done=t=>{const[r,b]=parse(t);if(r.length){S().r=r;grp='all'}msg=r.length?`Загружено анкет: ${r.length}, пропущено строк: ${b}.`:'Не удалось прочитать данные: проверьте формат столбцов.';render()};
if(/\.xlsx?$/i.test(f.name)){if(!window.XLSX){msg='Библиотека Excel недоступна. Сохраните файл как CSV.';return render()}const R=new FileReader();R.onload=()=>{const w=XLSX.read(R.result,{type:'array'});done(XLSX.utils.sheet_to_csv(w.Sheets[w.SheetNames[0]],{FS:';'}))};R.readAsArrayBuffer(f)}else{const R=new FileReader();R.onload=()=>done(String(R.result));R.readAsText(f,'utf-8')}}
function subTk(){const s=SV[TK.i];if(s.qs.some((_,j)=>!TK.a[j])){alert('Ответьте на все вопросы');return}s.r.push({id:s.anon?'anon'+Date.now():STU.id,g:STU.g,a:TK.a.slice(0,s.qs.length)});(DONE[s.id]=DONE[s.id]||[]).push({d:new Date().toLocaleDateString('ru-RU')});TK=null;msg='Спасибо! Ответы отправлены.';render()}
function subFb(){const t=$('#ft').value.trim();if(!t)return;FB.unshift({t,c:$('#fc').value,d:new Date().toLocaleDateString('ru-RU')});msg='Отзыв отправлен анонимно. Он появится у преподавателя в разделе «Образовательная среда».';render()}
render();
</script></body></html>
